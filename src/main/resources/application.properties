spring.application.name=spring-ai-mcp-starter
server.app.domain=localhost
server.port=8081
##Spring-Servlet Config
server.servlet.context-path=/api
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
#server.tomcat.max-threads=300
#server.tomcat.min-spare-threads=50
#server.tomcat.max-connections=10000
#server.tomcat.accept-count=500
##Actuator Web Expose
management.endpoints.web.exposure.include=health,metrics,httptrace,prometheus

#App-Settings:
app.disable.security=true

# Spring.AI MCP server config
spring.ai.mcp.server.name=my-mcp-starter
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# If enabled then resultant MCP endpoint will be: http://localhost:8080/api/mcp
#spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
